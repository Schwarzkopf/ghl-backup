<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>GHL Backup</title><style>body{font:16px system-ui;max-width:900px;margin:40px auto;padding:0 20px}button,input{padding:10px;margin:4px}pre{background:#f4f4f4;padding:16px;overflow:auto}.ok{color:green}.bad{color:#b00}</style></head><body><h1>GHL Backup</h1><p>Self-hosted HighLevel backup for one sub-account.</p><input id="token" type="password" placeholder="Admin token"><button onclick="status()">Refresh</button><button onclick="backup()">Run backup now</button><pre id="out">Loading...</pre><script>const A=()=>({Authorization:'Bearer '+document.getElementById('token').value});async function status(){const r=await fetch('/api/status',{headers:A()});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}async function backup(){const r=await fetch('/api/backup',{method:'POST',headers:A()});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}status()</script></body></html>
